name: GitCode distribution smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcode-distribution-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Test Git push, attachment upload and anonymous download
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.symlinks
          GIT_CONFIG_VALUE_0: 'false'
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test GitCode distribution without building the launcher
        env:
          GITCODE_USERNAME: ${{ secrets.GITCODE_USERNAME }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: node .github/scripts/gitcode-smoke-test.mjs
