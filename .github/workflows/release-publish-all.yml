name: Celestial Launcher release publish (all)

# Builds all three platforms once, then publishes the same installers as a
# DRAFT release to every target in parallel: GitHub, git.gay, and wemgit.
# The tag is taken from apps/app-frontend/package.json "version"
# (e.g. 3.2.0, no leading "v").
on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            args: --bundles nsis,msi
            out: target/release/bundle
            os: windows
            arch: x64
            java_distribution: temurin
            java_version: '17'
          - name: macos
            runner: macos-latest
            args: --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle
            os: macos
            arch: universal
            java_distribution: temurin
            java_version: '17'
          - name: linux
            runner: ubuntu-22.04
            args: ''
            out: target/release/bundle
            os: linux
            arch: x64
            java_distribution: temurin
            java_version: '17'
          - name: windows-arm64
            runner: windows-11-arm
            args: --bundles nsis,msi
            out: target/release/bundle
            os: windows
            arch: arm64
            # Temurin 无 win-arm64 的 Java 17；Zulu 有。
            java_distribution: zulu
            java_version: '17'
            skip_install_scripts: true
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            args: --bundles deb,rpm,appimage
            out: target/release/bundle
            os: linux
            arch: arm64
            java_distribution: temurin
            java_version: '21'

    runs-on: ${{ matrix.runner }}

    steps:
      # See celestial-release.yml: the repo carries a symlink with an empty
      # target that aborts checkout unless git materialises symlinks as files.
      - name: Disable git symlinks
        shell: bash
        run: git config --global core.symlinks false

      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Ensure macOS targets
        if: matrix.name == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # theseus.jar 的 gradle 构建需要 Java 17 工具链；发行版/版本按平台指定
      # （Windows ARM64→Zulu 17，其余→Temurin；Linux ARM64 用 21 + 镜像自带 17）。
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java_distribution }}
          java-version: ${{ matrix.java_version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # rpm 提供 rpmbuild、xdg-utils 提供 AppImage 需要的 xdg-mime（24.04-arm 不自带）。
      - name: Install Linux build dependencies
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Seed app-lib environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Install dependencies
        if: ${{ !matrix.skip_install_scripts }}
        run: pnpm install

      # Windows ARM64：workerd（web 前端 wrangler 的传递 devDep）无 win-arm64
      # 二进制，postinstall 会让整个 install 失败。app 构建用不到它，故跳过依赖
      # 脚本，再单独 rebuild vite 需要的 esbuild。
      - name: Install dependencies (skip scripts, Windows ARM64)
        if: ${{ matrix.skip_install_scripts }}
        shell: bash
        run: |
          pnpm install --ignore-scripts
          pnpm rebuild esbuild

      - name: Build
        shell: bash
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: pnpm --filter=@modrinth/app run tauri build ${{ matrix.args }}

      # 从各 bundle 目录提取安装包并规范化命名：
      #   CelestialLauncher-<version>-<os>-<arch>[-setup].<ext>
      - name: Collect installers
        shell: bash
        run: |
          version=$(node -p "require('./apps/app-frontend/package.json').version")
          base="CelestialLauncher-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p dist
          for f in "${{ matrix.out }}"/nsis/*-setup.exe;    do [ -e "$f" ] && cp "$f" "dist/${base}-setup.exe"; done
          for f in "${{ matrix.out }}"/msi/*.msi;           do [ -e "$f" ] && cp "$f" "dist/${base}.msi"; done
          for f in "${{ matrix.out }}"/dmg/*.dmg;           do [ -e "$f" ] && cp "$f" "dist/${base}.dmg"; done
          for f in "${{ matrix.out }}"/macos/*.app.tar.gz;  do [ -e "$f" ] && cp "$f" "dist/${base}.app.tar.gz"; done
          for f in "${{ matrix.out }}"/deb/*.deb;           do [ -e "$f" ] && cp "$f" "dist/${base}.deb"; done
          for f in "${{ matrix.out }}"/rpm/*.rpm;           do [ -e "$f" ] && cp "$f" "dist/${base}.rpm"; done
          for f in "${{ matrix.out }}"/appimage/*.AppImage; do [ -e "$f" ] && cp "$f" "dist/${base}.AppImage"; done
          ls -la dist

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: CelestialLauncher-${{ matrix.name }}
          path: dist/*
          if-no-files-found: ignore

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/app-frontend/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: $version"

      # Pull every platform's installers back into one flat folder.
      - name: Download all build output
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Celestial Launcher ${{ steps.version.outputs.version }}
          draft: true
          files: release-files/*

  publish-gitgay:
    name: Publish draft release to git.gay
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/app-frontend/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # git.gay wants a leading "v"; the updater strips it back off.
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "git.gay release tag will be: v$version"

      - name: Download all build output
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      # Forgejo exposes a Gitea-compatible REST API. Create the release as a
      # draft, then upload each installer as an asset. Requires a git.gay token
      # with write:repository scope stored as the GITGAY_TOKEN secret.
      - name: Create draft release and upload assets
        shell: bash
        env:
          GITGAY_TOKEN: ${{ secrets.GITGAY_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          API="https://git.gay/api/v1/repos/celestial-launcher/Celestial"
          AUTH="Authorization: token ${GITGAY_TOKEN}"

          echo "Creating draft release ${TAG}..."
          resp=$(curl -sS -X POST "${API}/releases" \
            -H "${AUTH}" \
            -H "Content-Type: application/json" \
            -d "$(node -e "console.log(JSON.stringify({tag_name: process.env.TAG, name: 'Celestial Launcher ' + process.env.VERSION, draft: true, prerelease: false}))")")

          release_id=$(echo "$resp" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.id){console.error(d);process.exit(1)}console.log(j.id)})")
          echo "Release id: ${release_id}"

          for f in release-files/*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading ${name}..."
            curl -sS -X POST "${API}/releases/${release_id}/assets?name=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$name")" \
              -H "${AUTH}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              -o /dev/null
          done
          echo "Done."

  publish-wemgit:
    name: Publish draft release to wemgit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/app-frontend/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # gitea wants a leading "v"; the updater strips it back off.
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "wemgit release tag will be: v$version"

      - name: Download all build output
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      # Gitea's REST API matches the Forgejo / GitLab shape. Create the release
      # as a draft, then upload each installer as an asset. Requires a Gitea
      # personal access token with write:repository scope stored as the
      # WEMGIT_TOKEN secret.
      - name: Create draft release and upload assets
        shell: bash
        env:
          WEMGIT_TOKEN: ${{ secrets.WEMGIT_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          API="https://download.celestial.byside.top/api/v1/repos/celestial/Celestial-Launcher"
          AUTH="Authorization: token ${WEMGIT_TOKEN}"

          echo "Creating draft release ${TAG}..."
          resp=$(curl -sS -X POST "${API}/releases" \
            -H "${AUTH}" \
            -H "Content-Type: application/json" \
            -d "$(node -e "console.log(JSON.stringify({tag_name: process.env.TAG, name: 'Celestial Launcher ' + process.env.VERSION, draft: true, prerelease: false}))")")

          release_id=$(echo "$resp" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.id){console.error(d);process.exit(1)}console.log(j.id)})")
          echo "Release id: ${release_id}"

          for f in release-files/*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading ${name}..."
            curl -sS -X POST "${API}/releases/${release_id}/assets?name=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$name")" \
              -H "${AUTH}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              -o /dev/null
          done
          echo "Done."
