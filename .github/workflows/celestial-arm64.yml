name: Celestial Launcher ARM64 (Windows + Linux)

# 独立的 ARM64 构建工作流：一次出 Windows ARM64 + Linux ARM64 两份产物。
#
# 两个平台都用 GitHub 托管的原生 ARM64 runner（公开仓库免费）：
#   - Linux:   ubuntu-24.04-arm
#   - Windows: windows-11-arm
# 因此是原生编译，不需要交叉编译 sysroot —— 这是能省事的关键。仓库转私有后
# 这些 runner 将不可用，届时需自建 runner 或改交叉编译。
#
# 两种用法：
#   1. 只出产物：Actions → 本工作流 → Run workflow，ref 填 `3.3.0`（或留空用
#      当前分支），跑完在 run 页面下载 CelestialLauncher-windows-arm64 /
#      CelestialLauncher-linux-arm64。
#   2. 直接挂到已有 release：tag 填 `3.3.0`，构建完自动把两份产物附加到该 release。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 ref / tag / commit（留空 = 触发时的分支）'
        required: false
        default: ''
      tag:
        description: '可选：构建完把产物附加到这个已存在的 release tag'
        required: false
        default: ''

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-arm64
            runner: windows-11-arm
            args: --bundles nsis,msi
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            args: --bundles deb,rpm,appimage

    runs-on: ${{ matrix.runner }}

    steps:
      # 见 celestial-release.yml：仓库里有一个空目标的符号链接，不关掉会中断 checkout。
      - name: Disable git symlinks
        shell: bash
        run: git config --global core.symlinks false

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # theseus.jar 的 gradle 构建需要 JVM 17+。ARM64 runner 的 Temurin 没有 17，
      # 最低是 21 LTS，21 满足 "17+"。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # librsvg2/webkit 是构建依赖；rpm 提供 rpmbuild（24.04 镜像不自带）；
      # xdg-utils 提供 AppImage 打包所需的 xdg-mime。
      - name: Install Linux build dependencies
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Seed app-lib environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - run: pnpm install

      - name: Build
        shell: bash
        run: pnpm --filter=@modrinth/app run tauri build ${{ matrix.args }}

      # 两个平台都是原生编译（不带 --target），产物都在 target/release/bundle。
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          for f in \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/msi/*.msi \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage; do
            [ -e "$f" ] && cp "$f" dist/
          done
          ls -la dist

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: CelestialLauncher-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # 仅在填了 tag 时运行：把上面两个平台构建的产物附加到已存在的 release。
  attach:
    name: Attach to release
    needs: build
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all ARM64 bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Attach to ${{ inputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release-files/*
