name: Celestial Launcher release build

# Builds Windows, macOS and Linux bundles in one run. Trigger it manually from
# the Actions tab (or push a v* tag) — cross-compiling Tauri locally is not
# possible, so this is the only way to get all platforms from one machine.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            args: --bundles nsis
            out: target/release/bundle
          - name: macos
            runner: macos-latest
            args: --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle
          - name: linux
            runner: ubuntu-22.04
            args: ''
            out: target/release/bundle

    runs-on: ${{ matrix.runner }}

    steps:
      # The repo carries a couple of symlink entries (`.dockerignore`, and an
      # AGENTS.md that upstream committed with an empty target). Checking out a
      # symlink with an empty target is impossible, which aborts `git checkout`
      # on every runner, so tell git to materialise symlinks as plain files.
      - name: Disable git symlinks
        shell: bash
        run: git config --global core.symlinks false

      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Seed app-lib environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - run: pnpm install

      - name: Build
        shell: bash
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: pnpm --filter=@modrinth/app run tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: CelestialLauncher-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/macos/*.app.tar.gz
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/rpm/*.rpm
            ${{ matrix.out }}/appimage/*.AppImage
          if-no-files-found: ignore
