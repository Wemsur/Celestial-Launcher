name: Bug 报告
description: 用于报告 Celestial Launcher 的 Bug。
labels: [app]
type: 'bug'
body:
  - type: checkboxes
    attributes:
      label: 请确认以下事项。
      options:
        - label: 我已检查 [现有issue](https://github.com/Wemsur/Celestial-Launcher/issues?q=is%3Aissue) 中是否存在重复 Bug
          required: true
        - label: 我已确保我的 Celestial Launcher 安装是最新版本
          required: true
  - type: input
    id: version
    attributes:
      label: 你正在使用哪个版本的 Celestial Launcher？
      description: 可在设置中找到
    validations:
      required: true
  - type: dropdown
    id: oses
    attributes:
      label: 你在哪些操作系统上遇到此 Bug？
      multiple: true
      options:
        - Windows
        - MacOS
        - Linux
  - type: textarea
    attributes:
      label: 描述该 Bug
      description: 清晰简洁地描述这个 Bug 是什么。如果可以，请附上截图。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 复现该行为的步骤。
      placeholder: |
        1. 转到“...”
        2. 点击“...”
        3. 向下滚动到“...”
        4. 发现 Bug
    validations:
      required: false
  - type: textarea
    attributes:
      label: 预期行为
      description: 清晰简洁地描述你预期发生什么。
    validations:
      required: false
  - type: textarea
    attributes:
      label: 附加信息
      description: 在此添加关于该Bug的其他信息。
    validations:
      required: false
